name: Quality

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  scripts-and-links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check shell syntax
        run: bash -n scripts/*.sh

      - name: Run ShellCheck
        uses: ludeeus/action-shellcheck@2.0.0
        with:
          scandir: './scripts'

      - name: Check Markdown links
        uses: lycheeverse/lychee-action@v2.4.1
        with:
          args: '--no-progress "**/*.md"'
          fail: true
